<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">🎭</div>
    <h1>CultureFlow</h1>
    <p class="subtitle">Sistema de gestión coreográfica</p>

    @if (error) {
      <div class="alert alert-error">{{ error }}</div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" [(ngModel)]="credentials.username" name="username"
               placeholder="Ingresa tu usuario" required>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="credentials.password" name="password"
               placeholder="Ingresa tu contraseña" required>
      </div>
      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <p class="auth-link">
      ¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a>
    </p>
  </div>
</div>
