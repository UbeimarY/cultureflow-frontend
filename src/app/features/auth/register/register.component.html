<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">🎭</div>
    <h1>Crear cuenta</h1>
    <p class="subtitle">Únete a CultureFlow</p>

    @if (error) { <div class="alert alert-error">{{ error }}</div> }

    <form (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group">
          <label>Nombre</label>
          <input type="text" [(ngModel)]="form.nombre" name="nombre" required>
        </div>
        <div class="form-group">
          <label>Apellido</label>
          <input type="text" [(ngModel)]="form.apellido" name="apellido" required>
        </div>
      </div>
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" [(ngModel)]="form.username" name="username" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="form.email" name="email" required>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="form.password" name="password" required>
      </div>
      <div class="form-group">
        <label>Rol</label>
        <select [(ngModel)]="form.rol" name="rol">
          @for (r of roles; track r) { <option [value]="r">{{ r }}</option> }
        </select>
      </div>
      @if (form.rol === 'DIRECTOR') {
        <div class="form-group">
          <label>Especialidad</label>
          <input type="text" [(ngModel)]="form.especialidad" name="especialidad">
        </div>
      }
      @if (form.rol === 'JURADO') {
        <div class="form-group">
          <label>Institución</label>
          <input type="text" [(ngModel)]="form.institucion" name="institucion">
        </div>
      }
      @if (form.rol === 'INTEGRANTE') {
        <div class="form-group">
          <label>Rol artístico</label>
          <input type="text" [(ngModel)]="form.rolArtistico" name="rolArtistico">
        </div>
      }
      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Registrando...' : 'Crear cuenta' }}
      </button>
    </form>
    <p class="auth-link">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </div>
</div>
